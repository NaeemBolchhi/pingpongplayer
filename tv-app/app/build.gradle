plugins {
    id 'com.android.application'
}

android {
    namespace 'nb.pingpong.pong'
    compileSdk 34

    defaultConfig {
        applicationId "nb.pingpong.pong"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // one APK per ABI plus a universal APK
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }

    // e.g. Pong-TV-1.0.0-arm64-v8a.apk / Pong-TV-1.0.0-universal.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter("ABI") ?: "universal"
            outputFileName = "Pong-TV-${variant.versionName}-${abi}.apk"
        }
    }

    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_FILE")) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            } else {
                storeFile file("test.keystore")
                storePassword "test123"
                keyAlias "testkey"
                keyPassword "test123"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'org.videolan.android:libvlc-all:3.5.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    // subtitle parsers (ASS/SSA, WebVTT, TTML) used by SubtitleConverter
    implementation 'androidx.media3:media3-extractor:1.3.1'
}
