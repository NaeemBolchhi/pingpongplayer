import groovy.json.JsonSlurper
import java.security.MessageDigest
import java.security.SecureRandom

plugins {
    id 'com.android.application'
}

android {
    namespace 'nb.pingpong.ping'
    compileSdk 34

    defaultConfig {
        applicationId "nb.pingpong.ping"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // one APK per ABI plus a universal APK
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }

    // e.g. Ping-Phone-1.0.0-arm64-v8a.apk / Ping-Phone-1.0.0-universal.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter("ABI") ?: "universal"
            outputFileName = "Ping-Phone-${variant.versionName}-${abi}.apk"
        }
    }

    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_FILE")) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            } else {
                storeFile file("test.keystore")
                storePassword "test123"
                keyAlias "testkey"
                keyPassword "test123"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// ---------------------------------------------------------------------------------------------
// SubSource API keys.
// The GitHub Actions secret SUBSOURCE_API_KEYS is a JSON array of keys, e.g. ["key1","key2"].
// At build time each key is encrypted and written to a generated KeyData.java; KeyVault decodes it at runtime.
// The key values are never printed.
// ---------------------------------------------------------------------------------------------
def keyGenDir = layout.buildDirectory.dir("generated/subsource/java")

tasks.register('generateSubsourceKeys') {
    outputs.dir(keyGenDir)
    outputs.upToDateWhen { false } // the secret can change without any file changing
    doLast {
        def raw = (System.getenv("SUBSOURCE_API_KEYS") ?: "").trim()
        def keys = []
        if (raw.startsWith("[")) {
            keys = new JsonSlurper().parseText(raw).collect { it.toString().trim() }
        } else if (raw) {
            keys = raw.split(/[\r\n,;]+/).collect { it.trim() }
        }
        keys = keys.findAll { it }.unique()
        keys.each { k ->
            if (k.length() > 8000 || k.toCharArray().any { ch -> ch < 33 || ch > 126 }) {
                throw new GradleException("SUBSOURCE_API_KEYS contains an entry that doesn't look like an API key")
            }
        }

        def rnd = new SecureRandom()
        byte[] seed = new byte[16]; rnd.nextBytes(seed)
        byte[] mask = new byte[16]; rnd.nextBytes(mask)
        byte[] masked = new byte[16]
        for (int i = 0; i < 16; i++) masked[i] = (byte) (seed[i] ^ mask[i])

        def b64 = { byte[] b -> Base64.encoder.encodeToString(b) }
        def enc = []
        keys.eachWithIndex { String k, int idx ->
            byte[] plain = k.getBytes("UTF-8")
            byte[] cipher = new byte[plain.length]
            def sha = MessageDigest.getInstance("SHA-256")
            byte[] block = null
            for (int p = 0; p < plain.length; p++) {
                if (p % 32 == 0) {
                    sha.reset()
                    sha.update(seed)
                    sha.update([(byte) (idx >>> 8), (byte) idx, (byte) p.intdiv(32)] as byte[])
                    block = sha.digest()
                }
                cipher[p] = (byte) (plain[p] ^ block[p % 32])
            }
            enc << b64(cipher)
        }

        def dir = new File(keyGenDir.get().asFile, "nb/pingpong/ping")
        dir.mkdirs()
        new File(dir, "KeyData.java").text = """package nb.pingpong.ping;

/** Generated by app/build.gradle - do not edit, do not commit. */
final class KeyData {
    private KeyData() {
    }

    static final String A = "${b64(masked)}";
    static final String B = "${b64(mask)}";
    static final String[] E = {${enc.collect { '"' + it + '"' }.join(', ')}};
}
"""
        println "SubSource keys embedded: ${keys.size()}"
        if (keys.isEmpty()) {
            println "WARNING: SUBSOURCE_API_KEYS is empty - subtitle search will be disabled in this build"
        }
    }
}

android.sourceSets.main.java.srcDir(keyGenDir)
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'generateSubsourceKeys' }

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'com.google.code.gson:gson:2.10.1'
}
