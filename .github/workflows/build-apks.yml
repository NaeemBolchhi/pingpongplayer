name: Build APKs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Grant execute permission for gradlew
      run: |
        chmod +x tv-app/gradlew 2>/dev/null || true
        chmod +x phone-app/gradlew 2>/dev/null || true
        
    - name: Create test keystore if not exists
      run: |
        keytool -genkey -v -keystore tv-app/app/test.keystore -alias testkey -keyalg RSA -keysize 2048 -validity 10000 -storepass test123 -keypass test123 -dname "CN=Test, OU=Test, O=Test, L=Test, S=Test, C=US" || true
        keytool -genkey -v -keystore phone-app/app/test.keystore -alias testkey -keyalg RSA -keysize 2048 -validity 10000 -storepass test123 -keypass test123 -dname "CN=Test, OU=Test, O=Test, L=Test, S=Test, C=US" || true
        
    - name: Build TV App
      env:
        KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd tv-app
        ./gradlew assembleRelease || gradle assembleRelease
        
    - name: Build Phone App
      env:
        KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd phone-app
        ./gradlew assembleRelease || gradle assembleRelease
        
    - name: Upload TV APK
      uses: actions/upload-artifact@v3
      with:
        name: tv-app-release
        path: tv-app/app/build/outputs/apk/release/*.apk
        
    - name: Upload Phone APK
      uses: actions/upload-artifact@v3
      with:
        name: phone-app-release
        path: phone-app/app/build/outputs/apk/release/*.apk
