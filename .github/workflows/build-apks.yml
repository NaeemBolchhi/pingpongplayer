name: Build APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: '8.7'

    # Release signing: if all four secrets exist they are used (KEYSTORE_FILE holds the
    # keystore as base64, e.g. `base64 -w0 release.jks`). Otherwise the build falls back
    # to a throw-away test key generated below.
    - name: Prepare signing key
      env:
        KEYSTORE_FILE_B64: ${{ secrets.KEYSTORE_FILE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_FILE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
          echo "Using signing key from secrets"
          echo "$KEYSTORE_FILE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
        else
          echo "No signing secrets found - generating a test key"
          for app in tv-app phone-app; do
            keytool -genkeypair -noprompt -keystore "$app/app/test.keystore" -alias testkey \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass test123 -keypass test123 \
              -dname "CN=Test, OU=Test, O=Test, L=Test, ST=Test, C=US"
          done
        fi

    - name: Build TV App (Pong!)
      working-directory: tv-app
      run: gradle assembleRelease --no-daemon

    - name: Build Phone App (Ping!)
      working-directory: phone-app
      run: gradle assembleRelease --no-daemon

    - name: Read version
      id: version
      run: echo "name=$(grep -oP 'versionName "\K[^"]+' tv-app/app/build.gradle)" >> "$GITHUB_OUTPUT"

    # Each artifact downloads as one zip holding every per-ABI APK plus the universal APK.
    - name: Upload Pong-TV zip
      uses: actions/upload-artifact@v6
      with:
        name: Pong-TV-${{ steps.version.outputs.name }}
        path: tv-app/app/build/outputs/apk/release/Pong-TV-*.apk
        if-no-files-found: error

    - name: Upload Ping-Phone zip
      uses: actions/upload-artifact@v6
      with:
        name: Ping-Phone-${{ steps.version.outputs.name }}
        path: phone-app/app/build/outputs/apk/release/Ping-Phone-*.apk
        if-no-files-found: error
